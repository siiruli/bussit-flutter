
query StopData($ids: [String], $name: String){
  stations(ids: $ids, name: $name) {
    name
    gtfsId
    code
    desc
    zoneId
    vehicleMode
    locationType
    platformCode
    lat
    lon
    stoptimesWithoutPatterns {
      scheduledDeparture
      realtimeDeparture
      departureDelay
      realtime
      realtimeState
      headsign
      serviceDay
      trip {
        gtfsId
        tripHeadsign
        routeShortName
        route {
          shortName
        }
      }
      stop {
        platformCode
      }
    }
  }
  stops(ids: $ids, name: $name) {
    name
    gtfsId
    code
    desc
    zoneId
    vehicleMode
    locationType
    platformCode
    lat
    lon
    stoptimesWithoutPatterns {
      scheduledDeparture
      realtimeDeparture
      departureDelay
      realtime
      realtimeState
      serviceDay
      headsign
      trip {
        route {
          shortName
        }
        gtfsId
        tripHeadsign
        routeShortName
      }
      stop {
        platformCode
      }
    }
  }
}
